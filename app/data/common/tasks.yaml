tasks:
- id: travel_request
  name: 출장 신청
  category: 출장·여비
  summary: 출장 가기 전에 기관 시스템에 출장 신청부터 등록하고 결재를 받아야 해요.
  keywords:
  - 출장
  - 출장 신청
  - 출장 가
  - 출장 예정
  - 출장 갈
  - 출장 가야
  - 출장 명령
  - 출장 잡혔
  - 출장 갑니
  - 출장 다녀오
  rule_queries:
  - 출장 신청 결재
  - 출장 명령
  steps:
  - 출장 전에 기관 시스템에 출장을 신청(등록)합니다.
  - '결재를 받습니다. 결재선: {결재선}'
  - 교통·숙박은 가능하면 법인카드로 결제하고 영수증을 보관합니다.
  required_docs:
  - 출장 신청(명령) 등록
  form: travel_request
  next_actions:
  - 출장 신청 결재 올리기
  - 복귀 후 여비 정산 준비
- id: travel_settlement
  name: 출장 여비 정산
  category: 출장·여비
  summary: 출장에서 돌아오면 교통비·숙박비 영수증을 모아 {용어:여비 정산서}를 내야 여비가 지급돼요.
  keywords:
  - 정산
  - 여비
  - 출장비
  - 다녀와서
  - 다녀왔
  - 출장 다녀
  - 갔다 왔
  - 영수증
  - 청구
  rule_queries:
  - '{용어:여비 정산서} 복귀 이내 제출'
  - 여비 정산 복귀 이내
  - 영수증 첨부
  steps:
  - 출장 신청이 결재되었는지 확인합니다.
  - 교통비·숙박비 영수증을 모읍니다.
  - 복귀한 날부터 {값:deadlines.travel_settlement_days}일 이내에 {용어:여비 정산서}를 작성하고 영수증을 첨부합니다.
  - '결재를 받습니다. 결재선: {결재선}'
  - 회계 담당이 {용어:지급 요청}을 처리하면 여비가 지급됩니다.
  required_docs:
  - '{용어:여비 정산서}'
  - 교통비 영수증
  - 숙박비 영수증
  form: travel_settlement
  deadline:
    key: deadlines.travel_settlement_days
    base: end_date
    direction: after
    label: '{용어:여비 정산서} 제출'
    base_label: 복귀일
  next_actions:
  - 영수증 모으기
  - '{용어:여비 정산서} 제출'
  - 결재 올리기
- id: annual_leave
  name: 연가 신청
  category: 복무·휴가
  summary: 연가는 쓰기 전에 미리 신청해서 승인을 받아야 해요.
  keywords:
  - 연가
  - 휴가
  - 연차
  - 쉬려
  - 쉬고
  - 쉬어야
  - 휴무
  rule_queries:
  - 연가 신청 전까지
  - 연가 승인
  - 휴가 신청 절차
  steps:
  - 남은 연가 일수를 확인합니다.
  - 사용일 {값:deadlines.leave_request_days_before}일 전까지 기관 시스템에 연가를 신청합니다.
  - 승인권자의 승인을 받습니다.
  - 급한 사정으로 미리 신청하지 못했다면 사용 후 바로 신청합니다.
  required_docs:
  - 연가 신청서
  form: leave_request
  deadline:
    key: deadlines.leave_request_days_before
    base: start_date
    direction: before
    label: 연가 신청
    base_label: 사용 시작일
  next_actions:
  - 남은 연가 확인
  - 연가 신청 올리기
- id: event_hosting
  name: 행사 개최
  category: 행사
  summary: 행사는 열기 전에 목적·일시·장소·예산을 담은 계획을 기안해서 결재받아야 해요.
  keywords:
  - 행사
  - 워크숍 개최
  - 설명회
  - 간담회
  - 세미나 개최
  - 행사 준비
  - 행사 기안
  - 행사 열려고
  - 행사 열어야
  rule_queries:
  - 행사 계획 기안 예산 장소
  - 행사 결과보고서
  steps:
  - 행사 목적·일시·장소·예산을 담은 행사 계획 기안문을 작성합니다.
  - '행사 {값:deadlines.event_plan_days_before|일}일 전까지 결재를 받습니다. 결재선: {결재선}'
  - 예산을 쓴다면 물품 구매와 같은 기준으로 견적을 받아 품의합니다.
  - 외부 장소라면 사용 가능 여부를 확인하고 예약합니다.
  - 행사가 끝나면 {값:deadlines.event_report_days|일}일 이내에 결과보고서를 작성합니다.
  required_docs:
  - 행사 계획 기안문
  - 결과보고서
  tips:
  - 일정을 확정하기 전에 국가애도기간·재난사태 선포 여부를 국민재난안전포털(safekorea.go.kr), 행정안전부 보도자료 등에서 확인하고, 해당된다면 일정을 조정하는 것도 고려해 보세요.
  deadline:
    key: deadlines.event_plan_days_before
    base: start_date
    direction: before
    label: 행사 계획 기안
    base_label: 행사일
  form: event_plan
  next_actions:
  - 행사 계획 기안문 작성
  - 장소·예산 확인
  - 결재 올리기
- id: general_approval
  name: 일반 기안/결재
  category: 결재
  summary: 기안문을 써서 결재선에 따라 올리고, 결재가 끝나면 시행 번호를 받아 관련 부서에 알려요.
  keywords:
  - 기안
  - 결재 올려야
  - 결재 받아야
  - 공문
  - 품의
  - 보고서 결재
  - 기안문
  rule_queries:
  - 기안문 작성 결재 절차
  - 결재 시행 보존
  steps:
  - 제목·목적·내용·조치사항을 담은 기안문을 작성합니다.
  - '결재를 받습니다. 결재선: {결재선}'
  - 결재가 끝나면 시행 번호를 받아 관련 부서·기관에 통보합니다.
  - 문서는 기록물로 분류해 보존 기간에 맞춰 보관합니다.
  required_docs:
  - 기안문
  form: draft_document
  next_actions:
  - 기안문 작성
  - 결재 올리기
- id: sick_leave
  name: 병가 신청
  category: 복무·휴가
  summary: 병가는 가능하면 미리, 급하면 당일 오전까지 신청해서 승인받으면 돼요.
  keywords:
  - 병가
  - 아파서
  - 아픈데
  - 몸이 안 좋
  - 병원 가야
  - 진단서
  - 몸살
  rule_queries:
  - 병가 신청 진단서
  - 병가 사전 당일
  steps:
  - 가능하면 사전에, 급한 경우 당일 오전까지 기관 시스템에 병가를 신청합니다.
  - 승인권자의 승인을 받습니다.
  - 연속 {값:sick_leave.certificate_days}일 이상 병가를 쓰면 의사 진단서를 첨부합니다.
  required_docs:
  - 병가 신청서
  form: sick_leave
  next_actions:
  - 병가 신청 올리기
  - 필요 시 진단서 준비
- id: purchase
  name: 물품 구매
  category: 물품·회계
  summary: 물품은 {용어:구매 요청서}로 결재를 받고, 금액에 맞게 견적을 받은 뒤 납품되면 검수까지 해야 해요.
  keywords:
  - 물품
  - 구매
  - 사야
  - 살려고
  - 사려고
  - 비품
  - 사무용품
  - 구입
  - 견적
  rule_queries:
  - '{용어:구매 요청서} 견적 추정가격'
  - 물품 구매 요청서 견적
  - 검수
  needs_amount: true
  steps:
  - '{용어:구매 요청서}를 작성해 결재를 받습니다. 결재선: {결재선}'
  - 추정가격 {값:purchase.single_quote_limit_won|원} 미만은 견적서 1부, 이상은 2인 이상 견적을 받습니다.
  - 납품되면 검수조서를 작성합니다.
  - 검수가 끝나면 {용어:지급 요청}을 합니다.
  required_docs:
  - '{용어:구매 요청서}'
  - 견적서
  - 검수조서
  form: purchase_request
  next_actions:
  - 견적 받기
  - '{용어:구매 요청서} 결재 올리기'
- id: lecture_report
  name: 외부강의 신고
  category: 외부강의
  summary: 사례금을 받는 외부강의는 마친 날부터 10일 이내에 신고해야 해요.
  keywords:
  - 외부강의
  - 외부 강의
  - 강의 나가
  - 강의 요청
  - 강의료
  - 사례금
  - 원고료
  - 출연료
  - 강연
  - 특강
  - 기고
  rule_queries:
  - 외부강의 신고
  - 사례금 상한
  - 외부강의 등 신고 기한
  steps:
  - 사례금을 받는 외부강의인지 확인합니다. 받지 않으면 신고 의무는 없습니다.
  - 요청자가 국가기관·지방자치단체면 신고 대상에서 빠지지만 사례금 상한은 그대로 적용됩니다.
  - 외부강의 등 신고서(F21)를 작성해 결재를 올립니다.
  - 외부강의를 마친 날부터 10일 이내에 신고를 마칩니다.
  - 상한을 넘는 사례금을 받았다면 2일 이내에 초과사례금 신고서(F22)를 내고 즉시 반환합니다.
  required_docs:
  - 외부강의 등 신고서
  form: draft_document
  next_actions:
  - 외부강의 신고서 올리기
  - 사례금 상한 확인
- id: excess_honorarium
  name: 초과사례금 신고
  category: 외부강의
  summary: 상한을 넘는 사례금을 받으면 2일 이내에 신고하고 돌려줘야 해요.
  keywords:
  - 초과사례금
  - 사례금 초과
  - 상한 넘
  - 강의료 초과
  - 반환해야
  rule_queries:
  - 초과사례금 신고
  - 사례금 반환
  steps:
  - 받은 사례금이 상한을 넘는지 확인합니다. 강의는 1시간당, 기고는 1건당 기준입니다.
  - 초과사례금 신고서(F22)를 작성합니다.
  - 받은 날부터 2일 이내에 서면으로 신고합니다.
  - 제공자에게 초과분을 즉시 반환합니다. 반환에 든 비용은 증명자료를 붙여 청구할 수 있습니다.
  required_docs:
  - 초과사례금 신고서
  form: draft_document
  next_actions:
  - 초과사례금 신고서 올리기
