  coop_required_over_won: 2000000
terms:
  지급 요청: 지급요청
  구매 요청서: 구매요청서
forms:
  travel_settlement: forms/travel_settlement.docx
  leave_request: forms/leave_request.docx
  purchase_request: forms/purchase_request.docx
  travel_request: forms/travel_request.docx
