org:
  id: bwyf
  name: 재단법인 부천여성청소년재단
  short: 재단
  type: 출연기관
  example: false
rule_layers:
- common
- org
- dept
approval:
  line:
  - 담당
  - 팀장
  - 실장
  - 대표이사
  thresholds:
  - max_won: 5000000
    approver: 실장
  - max_won: null
    approver: 대표이사
  ranks:
    0: 대표이사
    1: 실장·관장·센터장
    2: 부장(팀장)
    3: 차장
    4: 대리
    5: 직원
  approver_ranks:
    대표이사: 0
    실장: 1
    관장: 1
    센터장: 1
    팀장: 2
    부장: 2
  default_rank: 5
  by_rank:
  - name: 복무·출장
    tasks:
    - travel_request
    - travel_settlement
    - annual_leave
    - sick_leave
    basis: 책임 권한 규정 시행세칙 별표
    when:
    - rank_max: 1
      approver: 대표이사
    - rank_min: 2
      approver: 실장
  - name: 외부강의 신고
    tasks:
    - lecture_report
    - excess_honorarium
    basis: 외부강의 등 신고 업무처리 지침
    when:
    - rank_max: 2
      approver: 대표이사
    - rank_min: 3
      approver: 실장
