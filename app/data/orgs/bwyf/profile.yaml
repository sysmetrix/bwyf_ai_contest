- text: 영수증은 원본을 스캔해 PDF로 첨부합니다.
  task: travel_settlement
- text: 회계 담당은 매주 금요일에 지급을 처리합니다.
  task: travel_settlement
- text: 정산은 복귀 후 7일 안에만 내면 됩니다.
