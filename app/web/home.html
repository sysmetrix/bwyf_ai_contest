<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서비</title>
<link rel="icon" href="seobi.ico">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="home.css">
</head>
<body class="home">

<!-- 그라디언트·필터 정의는 문서에 딱 한 벌만 둡니다.
     캐릭터 SVG 안에 두면 패널 머리의 복제본과 id가 겹쳐서, 숨겨진 쪽이 먼저 잡히는 순간
     얼굴 채움과 발광 링이 통째로 사라집니다. -->
<svg class="h-defs" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="g-head" cx="38%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#fdfaf4"/><stop offset="100%" stop-color="#e8e0d2"/>
    </radialGradient>
    <linearGradient id="g-disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb0ec"/><stop offset="100%" stop-color="#3b6cb5"/>
    </linearGradient>
    <linearGradient id="g-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141a2c"/><stop offset="55%" stop-color="#0b0f1c"/><stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="g-ring" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#2f6fd0"/><stop offset="100%" stop-color="#8fc4ff"/>
    </radialGradient>
    <filter id="f-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-ringglow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

<!-- 상단: 할 일 알약 + 설정 -->
<div class="h-top">
  <button type="button" id="todoPill" class="h-pill" hidden>
    <span class="h-dot"></span><span id="todoPillText">할 일</span>
  </button>
  <details class="h-menu">
    <summary aria-label="설정 메뉴">⚙</summary>
    <div class="h-menu-body">
      <div class="h-menu-row">
        <label for="h_org">기관</label>
        <select id="h_org"></select>
      </div>
      <div class="h-menu-row">
        <label for="h_user">담당자</label>
        <select id="h_user"></select>
      </div>
      <hr>
      <a href="docs.html">규정·매뉴얼</a>
      <a href="forms.html">서식 보관함</a>
      <a href="profile.html">기관 프로필</a>
      <a href="models.html">로컬 모델</a>
      <a href="settings.html">설정</a>
      <hr>
      <a href="index.html">기존 화면으로</a>
    </div>
  </details>
</div>

<!-- 무대 -->
<main class="h-stage" id="stage">

  <!-- 위젯 모드에서만 보이는 패널 머리 (끌어서 옮기기 / 접기 / 숨기기) -->
  <div class="h-bar" id="bar">
    <span class="h-mini" id="mini" aria-hidden="true"></span>
    <b>서비</b>
    <button type="button" class="h-bar-btn" id="barTodo" title="작업 내역">☰</button>
    <button type="button" class="h-bar-btn" id="barCollapse" title="접기">—</button>
    <button type="button" class="h-bar-btn" id="barHide" title="숨기기">✕</button>
  </div>

  <div class="h-hero" id="hero">
    <span class="h-badge" id="badge" hidden></span>
    <button type="button" class="h-bot" id="bot" aria-label="서비에게 물어보기">
      <svg viewBox="0 0 200 210" class="h-bot-svg" aria-hidden="true">
        <!-- 걸을 때 몸 전체를 진행 방향으로 돌리기 위한 묶음 -->
        <g class="h-walkwrap">

        <!-- 새싹 -->
        <g class="h-sprout">
          <path d="M100 42 C100 30 100 24 100 20" stroke="#3c4a78" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="88" cy="16" rx="13" ry="9" fill="#44538a" transform="rotate(-28 88 16)"/>
          <ellipse cx="113" cy="14" rx="14" ry="9" fill="#3a4877" transform="rotate(22 113 14)"/>
        </g>

        <!-- 몸통 -->
        <g class="h-body">
          <ellipse cx="62" cy="176" rx="17" ry="13" fill="#eae1d1" stroke="#d6cab4" stroke-width="1.1"/>
          <ellipse cx="138" cy="176" rx="17" ry="13" fill="#eae1d1" stroke="#d6cab4" stroke-width="1.1"/>
          <rect x="68" y="130" width="64" height="52" rx="24" fill="#f6f1e6" stroke="#dfd5c2" stroke-width="1.2"/>
          <path d="M100 136 l9 7 -9 7 -9-7z" fill="#1d3058"/>
          <path d="M100 150 l7 0 3 22 -10 7 -10-7 3-22z" fill="#23396b"/>
          <path d="M118 150 a4 4 0 1 1 5 3 a4 4 0 1 1 -5 4 z" fill="#4f74bd" opacity=".9"/>
        </g>

        <!-- 팔 -->
        <ellipse class="h-arm h-arm-l" cx="52" cy="146" rx="14" ry="11" fill="#f3ede1" stroke="#ddd3c0" stroke-width="1.1"/>
        <ellipse class="h-arm h-arm-r" cx="148" cy="146" rx="14" ry="11" fill="#f3ede1" stroke="#ddd3c0" stroke-width="1.1"/>

        <!-- 소품: 평소엔 숨어 있다가 포즈에 따라 나옵니다 -->
        <g class="h-prop p-laptop">
          <path d="M70 176 h60 l9 11 h-78 z" fill="#c9cdd4" stroke="#aab0b9" stroke-width="1.2" stroke-linejoin="round"/>
          <rect x="74" y="148" width="52" height="29" rx="3.5" fill="#dfe3e8" stroke="#aab0b9" stroke-width="1.2"/>
          <rect x="78" y="151" width="44" height="23" rx="2.5" fill="#8fa4bd"/>
          <path d="M94 160 q6 6 12 0" stroke="#e8eef6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </g>

        <g class="h-prop p-book">
          <path d="M66 170 q34-12 34 0 q0-12 34 0 l0 20 q-34-12-34 0 q0-12-34 0 z"
                fill="#f6f1e6" stroke="#cfc4ae" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M100 170 v20" stroke="#cfc4ae" stroke-width="1.3"/>
          <path d="M74 176 h18 M74 181 h14" stroke="#c3b8a2" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M108 176 h18 M108 181 h14" stroke="#c3b8a2" stroke-width="1.6" stroke-linecap="round"/>
        </g>

        <g class="h-prop p-bulb">
          <circle cx="152" cy="22" r="12" fill="#ffd964" stroke="#e8b93c" stroke-width="1.4"/>
          <rect x="147" y="33" width="10" height="5" rx="2" fill="#c9a23a"/>
          <path d="M152 6 v-5 M166 12 l4-3 M138 12 l-4-3" stroke="#f0c44a" stroke-width="2.4" stroke-linecap="round"/>
        </g>

        <!-- 머리 -->
        <g class="h-head">
          <rect x="26" y="34" width="148" height="104" rx="46" fill="url(#g-head)" stroke="#ded3bf" stroke-width="1.3"/>
          <!-- 사이드 디스크: 바깥 발광 링 + 속 코어 -->
          <g filter="url(#f-ringglow)">
            <circle cx="30" cy="92" r="17.5" fill="#15203a"/>
            <circle cx="30" cy="92" r="14" fill="none" stroke="url(#g-ring)" stroke-width="5"/>
            <circle cx="170" cy="92" r="17.5" fill="#15203a"/>
            <circle cx="170" cy="92" r="14" fill="none" stroke="url(#g-ring)" stroke-width="5"/>
          </g>
          <!-- 얼굴 화면 -->
          <rect x="46" y="50" width="108" height="74" rx="32" fill="url(#g-screen)"/>
                    <!-- 표정 -->
          <g class="h-face" fill="#eaf6ff" filter="url(#f-glow)">
            <g class="f f-idle">
              <ellipse class="eye" cx="82" cy="83" rx="7" ry="9"/>
              <ellipse class="eye" cx="118" cy="83" rx="7" ry="9"/>
              <path d="M92 99 q8 7 16 0" stroke="#eaf6ff" stroke-width="4" fill="none" stroke-linecap="round"/>
            </g>
            <g class="f f-listen">
              <ellipse class="eye" cx="82" cy="82" rx="9" ry="11"/>
              <ellipse class="eye" cx="118" cy="82" rx="9" ry="11"/>
              <ellipse cx="100" cy="102" rx="6" ry="5"/>
            </g>
            <g class="f f-think">
              <rect x="74" y="80" width="16" height="4.5" rx="2.2"/>
              <rect x="110" y="80" width="16" height="4.5" rx="2.2"/>
              <circle class="td td1" cx="88" cy="101" r="3.2"/>
              <circle class="td td2" cx="100" cy="101" r="3.2"/>
              <circle class="td td3" cx="112" cy="101" r="3.2"/>
            </g>
            <g class="f f-happy">
              <path d="M72 86 q10-11 20 0" stroke="#eaf6ff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M108 86 q10-11 20 0" stroke="#eaf6ff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
              <path d="M88 100 q12 10 24 0" stroke="#eaf6ff" stroke-width="4" fill="none" stroke-linecap="round"/>
            </g>
            <g class="f f-sad">
              <ellipse cx="82" cy="83" rx="7" ry="9"/>
              <ellipse cx="118" cy="83" rx="7" ry="9"/>
              <path d="M92 103 q8-7 16 0" stroke="#eaf6ff" stroke-width="4" fill="none" stroke-linecap="round"/>
            </g>
            <g class="f f-sleep">
              <path d="M72 86 q10 9 20 0" stroke="#9fc4e4" stroke-width="4" fill="none" stroke-linecap="round"/>
              <path d="M108 86 q10 9 20 0" stroke="#9fc4e4" stroke-width="4" fill="none" stroke-linecap="round"/>
            </g>
          </g>
        </g>
        <g class="h-zzz" aria-hidden="true">
          <text class="z z1" x="150" y="38">z</text>
          <text class="z z2" x="164" y="24">z</text>
          <text class="z z3" x="178" y="12">z</text>
        </g>
        </g>

        <!-- 옆모습: 걸을 때만 나옵니다. 정면 그림을 눌러서 흉내 내면 기어가는 것처럼 보여서,
             오른쪽을 보고 선 모습을 따로 그렸습니다. 왼쪽으로 갈 때는 통째로 뒤집습니다. -->
        <g class="h-side">
          <!-- 뒤쪽 다리·팔을 먼저 그려 뒤에 깔립니다 -->
          <ellipse class="s-leg-back" cx="92" cy="178" rx="15" ry="12" fill="#ddd3c1" stroke="#cabda6" stroke-width="1.1"/>
          <ellipse class="s-arm-back" cx="92" cy="148" rx="12" ry="10" fill="#e4dccd" stroke="#cfc4ae" stroke-width="1.1"/>

          <!-- 몸통 -->
          <rect x="84" y="128" width="44" height="54" rx="21" fill="#f6f1e6" stroke="#dfd5c2" stroke-width="1.2"/>
          <path d="M122 134 l6 5 -6 5 -5-5z" fill="#1d3058"/>
          <path d="M122 144 l5 0 2 19 -7 6 -6-6 2-19z" fill="#23396b"/>

          <!-- 머리: 정면보다 좁습니다 -->
          <rect x="54" y="36" width="102" height="100" rx="44" fill="url(#g-head)" stroke="#ded3bf" stroke-width="1.3"/>

          <!-- 이쪽을 향한 사이드 디스크 하나 -->
          <g filter="url(#f-ringglow)">
            <circle cx="84" cy="92" r="16" fill="#15203a"/>
            <circle cx="84" cy="92" r="12.5" fill="none" stroke="url(#g-ring)" stroke-width="4.5"/>
          </g>

          <!-- 얼굴 화면은 앞쪽(오른쪽)에 붙습니다 -->
          <rect x="100" y="52" width="50" height="68" rx="24" fill="url(#g-screen)"/>
          <g class="s-face" fill="#eaf6ff" filter="url(#f-glow)">
            <ellipse class="s-eye" cx="128" cy="83" rx="6.5" ry="8.5"/>
            <path d="M120 101 q7 6 14 0" stroke="#eaf6ff" stroke-width="3.6" fill="none" stroke-linecap="round"/>
          </g>

          <!-- 새싹: 걸을 때 뒤로 날립니다 -->
          <g class="s-sprout">
            <path d="M104 40 C104 30 103 25 102 21" stroke="#3c4a78" stroke-width="5" fill="none" stroke-linecap="round"/>
            <ellipse cx="88" cy="18" rx="13" ry="8.5" fill="#44538a" transform="rotate(-32 88 18)"/>
            <ellipse cx="112" cy="14" rx="13" ry="8.5" fill="#3a4877" transform="rotate(14 112 14)"/>
          </g>

          <!-- 앞쪽 팔·다리는 맨 위에 -->
          <ellipse class="s-arm-front" cx="122" cy="148" rx="13.5" ry="11" fill="#f3ede1" stroke="#ddd3c0" stroke-width="1.1"/>
          <ellipse class="s-leg-front" cx="118" cy="178" rx="16" ry="12.5" fill="#f1eade" stroke="#d8cdb8" stroke-width="1.1"/>
        </g>
      </svg>
      <span class="h-shadow"></span>
    </button>

    <div class="h-bubble" id="bubble" hidden></div>
    <p class="h-tagline" id="tagline">무엇을 도와드릴까요?</p>
    <p class="h-sub" id="subline">상황을 그대로 적어 주세요. 절차·기한·결재선·근거 조문을 찾아 안내하고 서식 초안까지 만들어 드려요.</p>
  </div>

  <!-- 단일 검색창 -->
  <form class="h-search" id="searchForm" autocomplete="off">
    <input id="q" type="text" placeholder="예: 다음 주 세종 출장 다녀와서 정산해야 해요" aria-label="무엇이든 물어보세요">
    <button type="button" id="micBtn" class="h-icon" title="말로 입력" aria-label="말로 입력">🎤</button>
    <button type="button" id="resetBtn" class="h-icon" title="새 질문" aria-label="새 질문" hidden>↺</button>
    <button type="submit" id="sendBtn" class="h-send" aria-label="보내기">물어보기</button>
  </form>

  <div class="h-quick" id="quick"></div>

  <div class="h-scrollarea" id="scrollarea">
    <!-- 프로세스 바 -->
    <section class="card brf" id="briefing" hidden></section>
    <div class="h-proc" id="proc" hidden></div>
    <!-- 답변 -->
    <div class="h-feed" id="feed"></div>
  </div>
</main>

<!-- 할 일 서랍 -->
<aside class="h-drawer" id="todoDrawer" hidden>
  <div class="h-drawer-head">
    <b>작업 내역</b>
    <button type="button" id="todoClose" class="ghost" aria-label="닫기">✕</button>
  </div>
  <div id="todoBody" class="h-drawer-body"></div>
</aside>
<div class="h-scrim" id="scrim" hidden></div>

<script src="common.js"></script>
<script src="answer.js"></script>
<script src="home.js"></script>
</body>
</html>
