<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>규정·매뉴얼</title>
<link rel="stylesheet" href="app.css?v=21">
</head>
<body>
<header class="top"></header>
<div class="wrap">
  <div class="card" style="margin-bottom:16px">
    <div class="field"><label for="org">기관</label><select id="org" style="max-width:320px"></select></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <h2>규정·매뉴얼</h2>
    <p class="muted" style="margin:0 0 14px">서비가 답할 때 찾아보는 문서예요. 인터넷이 아니라 여기 있는 문서에서만 근거를 찾아요.
      <b>부서 보충</b> → <b>기관 규정</b> → <b>공통 규정</b> 순서로 가까운 문서를 먼저 따라요.</p>
    <div class="formbox" style="display:grid;gap:10px">
      <b>문서 올리기</b>
      <span class="muted" style="font-size:13px">PDF · 한글(HWPX) · 워드(DOCX) · 텍스트(MD, TXT). 옛 한글 HWP는 한글에서 HWPX나 PDF로 다시 저장해서 올려 주세요.
        올린 문서는 조문(제○조) 단위로 나눠서 다음 질문부터 바로 근거로 써요.</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select id="layer" style="width:auto">
          <option value="org">기관 규정 (기관 전체에 해당)</option>
          <option value="dept">부서 보충 (우리 부서만의 지침)</option>
        </select>
        <label class="btn primary" style="cursor:pointer">파일 골라서 올리기
          <input type="file" id="upload" class="sr-only" accept=".pdf,.hwpx,.docx,.md,.txt" multiple></label>
        <span id="upMsg" class="muted" style="font-size:13px"></span>
      </div>
    </div>
  </div>
  <div id="list"></div>
</div>
<script src="common.js?v=11"></script>
<script>
renderHeader();
const orgSel = document.getElementById("org");
const LAYERS = [["dept", "부서 보충", "우리 부서만의 지침. 가장 먼저 따라요."],
                ["org", "기관 규정", "기관 규정·업무 매뉴얼."],
                ["common", "공통 규정", "모든 기관에 공통으로 들어 있는 기본 규정이에요. 바꿀 수 없어요."]];

function openUrl(f) { return `/api/orgs/${encodeURIComponent(orgSel.value)}/docs/open?file=${encodeURIComponent(f)}`; }

async function load() {
  const box = document.getElementById("list");
  box.innerHTML = '<div class="card muted"><span class="spinner"></span> 불러오는 중… (큰 PDF는 처음 한 번 1분쯤 걸려요)</div>';
  const { docs } = await api(`/api/orgs/${orgSel.value}/docs`);
  box.innerHTML = LAYERS.map(([layer, title, desc]) => {
    const items = docs.filter((d) => d.layer === layer);
    return `<div class="card" style="margin-bottom:16px">
      <h3 style="margin:0 0 2px">${title} <span class="muted" style="font-weight:normal;font-size:13px">${items.length}개</span></h3>
      <p class="muted" style="margin:0 0 10px;font-size:13px">${desc}</p>
      ${items.length ? items.map((d) => `<div class="dash-item">
          <div style="min-width:0"><b style="word-break:break-all">${esc(d.name)}</b>
            <div class="due">조문 ${d.articles}개로 나눠 읽었어요</div></div>
          <div style="display:flex;gap:6px;flex:none">
            <a class="btn" href="${openUrl(d.file)}" target="_blank" rel="noopener">원문 열기</a>
            ${layer === "common" ? "" : `<button type="button" class="ghost del" data-file="${esc(d.file)}" data-name="${esc(d.name)}">빼기</button>`}
          </div></div>`).join("")
        : `<p class="muted" style="margin:0;font-size:13px">${layer === "common" ? "없음" : "아직 올린 문서가 없어요."}</p>`}
    </div>`;
  }).join("");
  box.querySelectorAll(".del").forEach((b) => (b.onclick = async () => {
    if (!confirm(`'${b.dataset.name}' 문서를 서비가 더 이상 참고하지 않게 뺄까요?\n(파일은 기관 폴더의 rules_deleted에 보관돼요)`)) return;
    try {
      await api(`/api/orgs/${orgSel.value}/docs?file=${encodeURIComponent(b.dataset.file)}`, { method: "DELETE" });
      toast("문서를 뺐어요"); load();
    } catch (e) { toast(e.message); }
  }));
}

document.getElementById("upload").onchange = async (ev) => {
  const files = [...ev.target.files];
  const msg = document.getElementById("upMsg");
  for (const [i, f] of files.entries()) {
    msg.innerHTML = `<span class="spinner"></span> ${esc(f.name)} 올리는 중 (${i + 1}/${files.length})`;
    const fd = new FormData(); fd.append("file", f); fd.append("layer", document.getElementById("layer").value);
    try {
      const r = await fetch(`/api/orgs/${orgSel.value}/docs`, { method: "POST", body: fd });
      if (!r.ok) throw new Error((await r.json()).detail || "올리기 실패");
    } catch (e) { msg.textContent = `${f.name}: ${e.message}`; ev.target.value = ""; return; }
  }
  msg.textContent = `${files.length}개 올렸어요. 다음 질문부터 근거로 써요.`;
  ev.target.value = "";
  load();
};

orgSel.onchange = () => { rememberOrg(orgSel.value); load(); };
fillOrgSelect(orgSel).then(load).catch((e) => toast(e.message));
</script>
</body>
</html>
