const groups={'메일쓰기':'메일','나의업무':'업무관리','근무시간현황':'임직원업무관리','근태신청서':'임직원업무관리','결재 HOME':'전자결재','결재작성':'전자결재'};
const compose={'메일쓰기':'메일','근태신청서':'임직원업무관리','결재작성':'전자결재'};
const labels={'임직원업무관리':'근태신청','전자결재':'결재작성','메일':'메일쓰기','일정':'일정 등록','자원':'예약 등록','게시판':'글쓰기','업무관리':'업무 등록','연락처':'연락처 추가'};
const card=(title,body,cls='')=>'<article class="card '+cls+'"><h3>'+title+'</h3>'+body+'</article>';
const empty='<div class="empty">데이터가 없습니다.</div>';
function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch{notify('브라우저 저장 공간을 사용할 수 없습니다.')} }
function notify(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3000)}
function list(rows){return rows.length?rows.map(r=>'<button class="row" data-item="'+safe(r.id)+'"><span>'+safe(r.title)+'</span><small>'+safe(r.status)+'　'+safe(r.date)+'</small></button>').join(''):empty}
function recent(){$('recent').innerHTML='최근검색어　'+state.recent.map(x=>'<button data-query="'+safe(x)+'">'+safe(x)+'</button>').join('')}
function calendar(){
 const first=month.getDay(),count=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
 return '<div class="actions"><button data-shift="-1" aria-label="이전 달">‹</button><strong>'+dateKey(month).slice(0,7).replace('-','.')+'</strong><button data-shift="1" aria-label="다음 달">›</button></div><div class="cal">'+[...'일월화수목금토'].map(x=>'<span>'+x+'</span>').join('')+'<span></span>'.repeat(first)+Array.from({length:count},(_,i)=>{const d=dateKey(new Date(month.getFullYear(),month.getMonth(),i+1));return '<button class="'+(d===chosen?'selected':'')+'" data-day="'+d+'">'+(i+1)+'</button>'}).join('')+'</div><p>'+chosen+'</p>'+list(state.rows.filter(r=>r.type==='일정'&&r.date===chosen));
}
function dashboard(){
 const t=state.time[dateKey(today)]??{};
 const profile='<div class="avatar">◯</div><p><b>데모 사용자</b></p><p>인트라넷</p><p>'+safe(t.in?'출근 '+t.in+(t.out?' · 퇴근 '+t.out:''):'출근시간없음')+'</p><div class="actions"><button data-clock="in" '+(t.in?'disabled':'')+'>출근</button><button data-clock="out" '+(!t.in||t.out?'disabled':'')+'>퇴근</button></div>';
 const rules=['업무문서 보관','퇴근 시 PC 끄기','비밀번호 설정','화면 잠금','보안 점검','정품 사용','안전한 사이트','업무 메일 사용'];
 const banner='<article class="card banner"><strong>꼭 지켜야 할<br>정보보호<br>실천수칙</strong><div class="rules">'+rules.map((r,i)=>'<span><b>'+['▤','◉','▦','▣','⚙','◈','✓','✉'][i]+'</b>'+r+'</span>').join('')+'</div></article>';
 $('dash').innerHTML='<div class="col">'+card('내정보',profile,'profile')+card('일정캘린더',calendar())+'</div><div class="col">'+banner+card(button('결재함　›','전자결재'),list(state.rows.filter(r=>r.type==='전자결재').slice(0,4)))+card(button('게시판　›','게시판'),list(state.rows.filter(r=>r.type==='게시판').slice(0,4)))+'</div><div class="col">'+card(button('알림전체　›','알림'),list(state.rows.filter(r=>r.type==='알림').slice(0,6)))+card(button('결재문서현황　›','전자결재'),'<p>진행 중　'+state.rows.filter(r=>r.status==='상신').length+'건</p>')+'</div>';
 recent();
}
function render(){
 $('home').hidden=page!=='홈';$('workspace').hidden=page==='홈';
 if(page==='홈'){dashboard();return}
 const type=groups[page]??page;
 const rows=type==='통합검색'?state.rows.filter(r=>term&&[r.title,r.body,r.type].some(v=>v.toLowerCase().includes(term.toLowerCase()))):state.rows.filter(r=>r.type===type);
 const searchForm=type==='통합검색'?'<form id="resultsSearch"><input name="term" aria-label="검색어" value="'+safe(term)+'" placeholder="검색어 입력"><button class="link">검색</button></form><p>검색 결과 '+rows.length+'건</p>':'';
 const attendance=type==='임직원업무관리'?Object.entries(state.time).map(([date,t])=>'<div class="row">'+date+'<span>출근 '+safe(t.in)+'　퇴근 '+safe(t.out??'—')+'</span></div>').join(''):'';
 $('workspace').innerHTML='<div class="toolbar">'+button('⌂ 홈','홈')+(labels[type]?'<button class="primary" data-new="'+type+'">'+labels[type]+'</button>':'')+'</div>'+card(page,searchForm+attendance+(type==='일정'?calendar():list(rows)));
}
function go(target){page=target;render();window.scrollTo(0,0);if(compose[target])editor(compose[target])}
function search(value){term=value.trim();if(term){state.recent=[term,...state.recent.filter(x=>x!==term)].slice(0,3);persist()}go('통합검색')}
function editor(type){
 const dateField=['일정','자원','임직원업무관리'].includes(type);
 $('modal').innerHTML='<form id="edit"><h2>'+labels[type]+'</h2><p>데모 기록은 이 브라우저에 저장됩니다.</p><label>제목<input name="title" required maxlength="120"></label>'+(dateField?'<label>날짜<input type="date" name="date" value="'+chosen+'" required></label>':'')+'<label>내용<textarea name="body" required maxlength="2000"></textarea></label><button class="primary">'+(type==='전자결재'?'상신':'저장')+'</button> <button type="button" data-close>취소</button></form>';
 $('modal').showModal();
 $('edit').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const title=f.get('title').trim(),body=f.get('body').trim();if(!title||!body){notify('제목과 내용을 입력해 주세요.');return}state.rows.unshift({id:crypto.randomUUID?.()??String(Date.now()),type,title,body,date:f.get('date')??dateKey(today),status:type==='전자결재'?'상신':'등록'});persist();$('modal').close();render();notify('데모 기록을 저장했습니다.')};
}
$('rail').innerHTML=button('▦','홈')+menus.map((m,i)=>'<button data-page="'+m+'" title="'+m+'" aria-label="'+m+'">'+icons[i]+'</button>').join('');
$('dock').innerHTML=shortcuts.map((m,i)=>button('<span class="icon" style="--c:'+colors[i]+'">'+(icons[menus.indexOf(groups[m]??m)]??'✎')+'</span>'+m,m)).join('');
$('search').onsubmit=e=>{e.preventDefault();search($('query').value)};
$('down').onclick=()=>$('dock').scrollIntoView({behavior:'smooth',block:'start'});
document.addEventListener('submit',e=>{if(e.target.id==='resultsSearch'){e.preventDefault();search(new FormData(e.target).get('term'))}});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const d=b.dataset;
 if(d.page)go(d.page);
 if(d.query)search(d.query);
 if(d.new)editor(d.new);
 if(d.close!==undefined)$('modal').close();
 if(d.shift){month=new Date(month.getFullYear(),month.getMonth()+Number(d.shift),1);render()}
 if(d.day){chosen=d.day;render()}
 if(d.clock){const k=dateKey(today), t=state.time[k]??={};if(t[d.clock]||(d.clock==='out'&&!t.in))return;t[d.clock]=new Date().toLocaleTimeString('ko-KR');persist();render();notify('근태 시간을 기록했습니다.')}
 if(d.item){const r=state.rows.find(x=>x.id===d.item);$('modal').innerHTML='<h2>'+safe(r.title)+'</h2><p>'+safe(r.type)+'　'+safe(r.date)+'　'+safe(r.status)+'</p><p style="white-space:pre-wrap">'+safe(r.body)+'</p><button data-close>닫기</button>';$('modal').showModal()}
});
render();



</script><script>
const modules={
 '전자결재':{title:'전자결재(비영리)',start:'상신문서',create:'결재작성',nav:['결재 HOME',['상신/보관함','임시보관문서','상신문서','반려/회수문서','열람문서'],['결재함','결재대기문서','결재완료문서'],'문서유통','문서함']},
 '메일':{start:'받은메일함',create:'메일쓰기',nav:['전체메일함','받은메일함','보낸메일함','예약메일함','임시보관함','내메일함','스팸메일함','휴지통']},
 '일정':{start:'전체일정',create:'일정 등록',nav:['전체일정','내 일정','부서 일정']},
 '자원':{start:'전체 자원',create:'자원 예약',nav:['전체 자원','나의예약현황']},
 '게시판':{start:'공지사항',create:'글쓰기',nav:['전체 게시글','공지사항','자유게시판','자료실']},
 '업무관리':{start:'나의업무',create:'업무 등록',nav:['나의업무','요청업무','완료업무']},
 '연락처':{start:'전체 연락처',create:'연락처 추가',nav:['전체 연락처','연락처 그룹','즐겨찾기']},
 '임직원업무관리':{start:'근무시간현황',create:'근태신청서',nav:['근무시간현황','근태신청내역']}
};
let active='',folder='',filter='',from='',to='',direction='new',docKind='',offset=0,collapsed=false,selected=new Set();
const initial=[
 ['전자결재','상신문서','시설 운영물품 구매 요청','물품매입 품의서','결재중'],
 ['전자결재','결재대기문서','월간 운영계획 검토','일반기안문','결재대기'],
 ['전자결재','결재완료문서','정기 시설 점검 결과','결과보고서','결재완료'],
 ['메일','받은메일함','업무 포털 이용 안내','운영지원팀','미열람'],
 ['자원','전체 자원','회의실 A','본관 2층 · 12석','예약 가능'],
 ['자원','전체 자원','회의실 B','별관 1층 · 8석','예약 가능']
];
if(!state.modulesSeeded){
 const defaults={'게시판':'공지사항','업무관리':'나의업무','연락처':'전체 연락처','메일':'받은메일함'};
 state.rows.forEach(r=>{r.folder??=defaults[r.type]??modules[r.type]?.start});
 state.rows=state.rows.filter(r=>r.id!=='sample-4'&&r.id!=='sample-2');
 state.rows.push(...initial.map(([type,folder,title,body,status],i)=>({type,folder,title,body,status,date:dateKey(today),id:'module-'+i,kind:'생산문서'})));
 state.modulesSeeded=true;persist();
}
const oldRender=render,oldGo=go,oldEditor=editor;
const sub=(name)=>'<button class="navitem '+(folder===name?'active':'')+'" data-folder="'+safe(name)+'">'+safe(name)+'</button>';
const attrs=(key,value)=>' data-'+key+'="'+safe(value)+'"';
const action=(label,id,enabled=true)=>'<button data-act="'+id+'" '+(enabled?'':'disabled')+'>'+label+'</button>';
const input=(name,label,value='',type='text')=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+safe(value)+'" required></label>';
function recordsFor(){
 return state.rows.filter(r=>{
  if(r.type!==active)return false;
  if(folder==='결재 HOME')return true;
  if(folder==='전체메일함')return !['휴지통','스팸메일함'].includes(r.folder);
  if(folder==='전체 게시글')return true;
  if(folder==='즐겨찾기')return r.star;
  if(active==='일정')return (folder==='전체일정'||r.folder===folder)&&r.date===chosen;
  return r.folder===folder;
 });
}
function changeFolder(target){folder=target;filter='';from='';to='';docKind='';offset=0;selected.clear();render()}
go=function(target){
 const type=groups[target]??target;
 if(!modules[type]){active='';oldGo(target);return}
 active=type;page=target;
 changeFolder(target==='결재 HOME'?target:modules[type].start);
 window.scrollTo(0,0);
 if(compose[target])openForm();
};
render=function(){
 document.body.classList.toggle('inside',Boolean(active));
 document.querySelector('.modtab')?.remove();
 if(!active){oldRender();return}
 $('home').hidden=true;$('workspace').hidden=false;
 const m=modules[active],approval=active==='전자결재',mail=active==='메일',isTime=folder==='근무시간현황';
 document.querySelector('header strong').parentElement.insertAdjacentHTML('afterend','<button class="modtab" data-page="홈">'+(m.title??active)+' ×</button>');
 const rows=recordsFor().filter(r=>(!filter||[r.title,r.body,r.party].some(v=>String(v??'').toLowerCase().includes(filter.toLowerCase())))&&(!from||r.date>=from)&&(!to||r.date<=to)&&(!docKind||(r.kind??'생산문서')===docKind)).sort((a,b)=>direction==='new'?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
 const visible=rows.slice(offset,offset+12);
 const cols=approval?['기안일','제목/문서번호','발송처','결재상태']:mail?['받은날짜','제목','보낸사람 / 받는사람','상태']:['날짜','제목','담당 / 분류','상태'];
 const table='<table class="records"><thead><tr><th><input type="checkbox" data-select-all aria-label="현재 페이지 전체 선택" '+(visible.length&&visible.every(r=>selected.has(r.id))?'checked':'')+'></th>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+visible.map(r=>'<tr><td><input type="checkbox"'+attrs('select',r.id)+' aria-label="'+safe(r.title)+' 선택" '+(selected.has(r.id)?'checked':'')+'></td><td>'+safe(r.date)+'</td><td class="titlecell"><button'+attrs('record',r.id)+'>'+safe(r.title)+(r.star?' ★':'')+'<small>'+safe(approval?(r.kind??'생산문서')+'　'+(r.template??r.body):r.summary??r.body.slice(0,45))+'</small></button></td><td>'+safe(r.party??'–')+'</td><td class="badge '+(/완료|발송/.test(r.status)?'done':'')+'">'+safe(r.status)+'</td></tr>').join('')+'</tbody></table>';
 const times=Object.entries(state.time).map(([date,t])=>'<p>'+safe(date)+'　출근 '+safe(t.in)+'　퇴근 '+safe(t.out??'—')+'</p>').join('');
 const nav=m.nav.map(n=>Array.isArray(n)?'<details open><summary>▾ '+n[0]+'</summary>'+n.slice(1).map(sub).join('')+'</details>':sub(n)).join('');
 let tools=action('새로고침','refresh');
 const current=rows.filter(r=>selected.has(r.id));
 if(approval)tools=action('열람지정','share',current.length===1)+action('회수','withdraw',current.some(r=>r.folder==='상신문서'))+action('재기안','duplicate',current.length===1);
 if(mail)tools=action('읽음','read',current.length>0)+action('중요','star',current.length>0)+action(folder==='휴지통'?'복원':'휴지통 이동',folder==='휴지통'?'restore':'trash',current.length>0);
 if(active==='업무관리')tools+=action('완료 처리','complete',current.length>0);
 if(active==='자원'&&folder==='나의예약현황')tools+=action('예약 취소','cancel',current.some(r=>r.status==='예약완료'));
 const kinds=approval?'<label><input type="radio" name="docKind" value="" '+(!docKind?'checked':'')+'>모든문서</label> <label><input type="radio" name="docKind" value="생산문서" '+(docKind==='생산문서'?'checked':'')+'>생산문서</label> <label><input type="radio" name="docKind" value="접수문서" '+(docKind==='접수문서'?'checked':'')+'>접수문서</label>':'';
 $('workspace').innerHTML='<div class="modbar"><button data-act="toggle" aria-label="업무 메뉴 접기 또는 펼치기">☰</button>'+(m.title??active)+'</div><div class="modlayout '+(collapsed?'collapsed':'')+'"><nav class="subnav"><button class="primary" data-act="new">'+m.create+'</button>'+nav+'</nav><section class="panel"><div class="paneltop"><div><strong>'+folder+'</strong><small>'+rows.length+'</small></div><form class="filters" id="moduleFilter">'+(approval?'<select aria-label="검색 기준"><option>기안일</option></select>':'')+'<input type="date" aria-label="시작 날짜" name="from" value="'+from+'"><span>~</span><input type="date" aria-label="종료 날짜" name="to" value="'+to+'"><input aria-label="제목 또는 내용 검색" name="filter" placeholder="검색" value="'+safe(filter)+'"><button>⌕ 검색</button></form></div><div class="paneltools"><div>'+tools+'</div><div>'+kinds+' <select id="moduleSort" aria-label="정렬"><option value="new">최신순</option><option value="old" '+(direction==='old'?'selected':'')+'>오래된순</option></select></div></div><div class="gridwrap">'+(active==='일정'?calendar():isTime?times||empty:visible.length?table:empty)+(rows.length>12?'<div class="modpager">'+action('이전','prev',offset>0)+(Math.floor(offset/12)+1)+action('다음','next',offset+12<rows.length)+'</div>':'')+'<p class="notice">테스트용 업무 공간 · 브라우저에 저장</p></div></section></div>';
};
function openForm(source){
 const type=active,m=modules[type],approval=type==='전자결재',mail=type==='메일',resource=type==='자원',contact=type==='연락처';
 const calendarType=['일정','자원','임직원업무관리'].includes(type);
 const editable=source&&['임시보관함','임시보관문서'].includes(source.folder);
 const party=mail?input('party','받는 사람',source?.party??'','email'):approval?input('party','결재자',source?.party??''):contact?input('party','이메일',source?.party??'','email'):'';
 const options=approval?'<label>결재 양식<select name="template"><option>일반기안문</option><option>물품매입 품의서</option><option>결과보고서</option></select></label>':resource?'<label>자원<select name="resource">'+state.rows.filter(r=>r.type==='자원'&&r.folder==='전체 자원').map(r=>'<option>'+safe(r.title)+'</option>').join('')+'</select></label>':'';
 $('modal').innerHTML='<form id="moduleEdit"><h2>'+m.create+'</h2>'+options+party+input('title',contact?'이름':'제목',source?.title??'')+(calendarType?input('date','날짜',source?.date??chosen,'date'):'')+(resource?'<div class="formrow">'+input('start','시작 시간','09:00','time')+input('end','종료 시간','10:00','time')+'</div>':'')+'<label>'+ (contact?'소속 및 전화번호':'내용')+'<textarea name="body" required>'+safe(source?.body??'')+'</textarea></label><p class="notice">테스트 기록으로 처리됩니다.</p><button class="primary" name="mode" value="submit">'+(approval?'상신':mail?'발송 처리':'등록')+'</button> '+(approval||mail?'<button name="mode" value="draft" formnovalidate>임시저장</button> ':'')+'<button type="button" data-close>취소</button></form>';
 if($('modal').open)$('modal').close();
 $('modal').showModal();
 $('moduleEdit').onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target),val=n=>String(f.get(n)??'').trim(),draft=e.submitter?.value==='draft';
  const title=val('title'),body=val('body'),date=val('date')||dateKey(today);
  if(!draft&&(!title||!body||((mail||approval||contact)&&!val('party')))){notify('필수 항목을 입력해 주세요.');return}
  if(resource&&(val('start')>=val('end')||state.rows.some(r=>r.type==='자원'&&r.status==='예약완료'&&r.date===date&&r.resource===val('resource')&&val('start')<r.end&&val('end')>r.start))){notify('시간 범위와 기존 예약을 확인해 주세요.');return}
  const dest=approval?(draft?'임시보관문서':'상신문서'):mail?(draft?'임시보관함':'보낸메일함'):resource?'나의예약현황':type==='임직원업무관리'?'개인근태신청현황':m.nav.includes(folder)&&!['전체일정','전체 게시글','즐겨찾기','완료업무'].includes(folder)?folder:m.start;
  const status=draft?'임시저장':approval?'결재중':mail?'발송 처리':resource?'예약완료':type==='업무관리'?'진행중':'등록';
  const rec={id:editable?source.id:(crypto.randomUUID?.()??String(Date.now())),type,folder:dest,title:title||'제목 없음',body,date,status,party:val('party')||val('resource'),kind:'생산문서',template:val('template'),resource:val('resource'),start:val('start'),end:val('end')};
  state.rows=state.rows.filter(r=>r.id!==rec.id);state.rows.unshift(rec);
  if(calendarType)chosen=date;
  persist();$('modal').close();changeFolder(dest);notify('처리했습니다.');
 };
}
function viewRecord(r){
 if(r.type==='메일'&&r.status==='미열람'){r.status='읽음';persist();render()}
 const edit=['임시보관문서','임시보관함'].includes(r.folder);
 $('modal').innerHTML='<h2>'+safe(r.title)+'</h2><p>'+safe(r.date)+'　'+safe(r.status)+'　'+safe(r.party)+'</p>'+(r.start?'<p>'+safe(r.start)+' ~ '+safe(r.end)+'</p>':'')+'<p style="white-space:pre-wrap">'+safe(r.body)+'</p>'+(edit?action('이어서 작성','edit'):'')+(r.type==='전자결재'&&r.folder==='결재대기문서'?action('승인','approve')+' '+action('반려','reject'):'')+(r.type==='연락처'?action('즐겨찾기 전환','favorite'):'')+' <button data-close>닫기</button>';
 $('modal').dataset.record=r.id;
 $('modal').showModal();
}
document.addEventListener('submit',e=>{
 if(e.target.id!=='moduleFilter')return;
 e.preventDefault();const f=new FormData(e.target);
 if(f.get('from')&&f.get('to')&&f.get('from')>f.get('to')){notify('종료일은 시작일 이후로 지정해 주세요.');return}
 filter=f.get('filter').trim();from=f.get('from');to=f.get('to');offset=0;selected.clear();render();
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='moduleSort'){direction=el.value;offset=0;render()}
 if(el.name==='docKind'){docKind=el.value;offset=0;selected.clear();render()}
 if(el.dataset.select){if(el.checked)selected.add(el.dataset.select);else selected.delete(el.dataset.select);render()}
 if(el.hasAttribute('data-select-all')){document.querySelectorAll('[data-select]').forEach(x=>el.checked?selected.add(x.dataset.select):selected.delete(x.dataset.select));render()}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||!active)return;
 const {folder:target,record,act}=b.dataset;
 if(target){changeFolder(target);return}
 if(record){viewRecord(state.rows.find(r=>r.id===record));return}
 if(!act)return;
 const r=state.rows.find(x=>x.id===$('modal').dataset.record);
 const rows=recordsFor().filter(x=>selected.has(x.id));
 if(act==='new'){openForm();return}
 if(act==='edit'||act==='duplicate'){openForm(act==='edit'?r:rows[0]);return}
 if(act==='toggle'){collapsed=!collapsed;render();return}
 if(['next','prev','refresh'].includes(act)){offset=act==='next'?offset+12:act==='prev'?Math.max(0,offset-12):0;render();return}
 if(act==='share'){
  const doc=rows[0];
  $('modal').innerHTML='<form id="shareForm"><h2>열람지정</h2>'+input('viewer','열람자')+'<button class="primary">저장</button> <button type="button" data-close>취소</button></form>';
  $('modal').showModal();$('shareForm').onsubmit=ev=>{ev.preventDefault();doc.viewer=new FormData(ev.target).get('viewer');state.rows.unshift({...doc,id:crypto.randomUUID?.()??String(Date.now()),folder:'열람문서',party:doc.viewer,status:'열람지정'});persist();$('modal').close();render();notify('열람자를 지정했습니다.')};return;
 }
 if(act==='approve'||act==='reject'){r.folder=act==='approve'?'결재완료문서':'반려/회수문서';r.status=act==='approve'?'결재완료':'반려'}
 if(act==='favorite')r.star=!r.star;
 for(const row of rows){
  if(act==='withdraw'&&row.folder==='상신문서'){row.folder='반려/회수문서';row.status='회수'}
  if(act==='read')row.status='읽음';
  if(act==='star')row.star=!row.star;
  if(act==='trash'){row.previousFolder=row.folder;row.folder='휴지통'}
  if(act==='restore')row.folder=row.previousFolder??'받은메일함';
  if(act==='complete'){row.folder='완료업무';row.status='완료'}
  if(act==='cancel'&&row.status==='예약완료')row.status='예약취소';
 }
 if($('modal').open)$('modal').close();
 persist();selected.clear();render();notify('처리했습니다.');
});

 priorRender();
 if(!active)return;
 const panel=$('workspace').querySelector('.panel');
 if(active==='전자결재'&&folder==='결재작성'){
  const matches=docs.filter(d=>(catalogGroup!=='기본기안문'||d.includes('기안문'))&&d.includes(catalogQuery));
  panel.innerHTML='<div class="paneltop"><strong>결재작성</strong></div><div class="catalog"><div><form class="filters" id="catalogSearch"><input name="q" aria-label="카테고리 또는 양식명" placeholder="카테고리/양식명 입력" value="'+safe(catalogQuery)+'"><button>검색</button></form>'+['전체양식','기본기안문'].map(n=>'<button class="category '+(catalogGroup===n?'active':'')+'"'+attrs('category',n)+'>'+n+'</button>').join('')+'</div><div><h3>자주 사용되는 양식</h3>'+(!catalogQuery?tile(docs[0],'draftform'):'')+'<h3>'+catalogGroup+'</h3>'+(matches.length?matches.map(d=>tile(d,'draftform')).join(''):empty)+'</div></div>';
 }
 if(active==='임직원업무관리'&&folder==='근태신청서'){
  panel.innerHTML='<div class="paneltop"><strong>근태신청서</strong></div><div class="catalog"><div><h3>근태신청서 양식 선택</h3>'+tile('출장신청서','trip')+tile('기타 근태신청','attendance')+'</div><div><h3>근태신청현황</h3>'+calendar()+'</div></div>';
 }

function showWide(content){
 const modal=$('modal');
 if(modal.open)modal.close();
 modal.classList.add('wideform');
 modal.innerHTML=content;
 modal.showModal();
}
$('modal').addEventListener('close',()=>{if(!$('modal').open)$('modal').classList.remove('wideform')});

const selectField=(name,label,options,value)=>'<label>'+label+'<select name="'+name+'">'+options.map(x=>'<option '+(x===value?'selected':'')+'>'+x+'</option>').join('')+'</select></label>';
function saveDoc(rec,existing){
 const editing=existing?.folder==='임시보관문서';
 rec.id=editing?existing.id:(rec.id??crypto.randomUUID?.()??String(Date.now()));
 state.rows=state.rows.filter(r=>r.id!==rec.id);
 state.rows.unshift(rec);persist();$('modal').close();
 active='전자결재';page='전자결재';changeFolder(rec.folder);notify(rec.status==='임시저장'?'임시보관문서에 저장했습니다.':'상신문서에 등록했습니다.');
}
function draftEditor(template,existing){
 const data=existing?.details??{};
 if(template==='출장신청서'&&existing?.details?.trip){tripEditor(data);return}
 showWide('<form id="draftEditor">'+dialogTop(template)+'<div class="draftbody"><h3>결재선</h3><div class="formrow">'+input('party','결재자',existing?.party??'')+'<label>참조<input name="cc" value="'+safe(data.cc)+'"></label></div><h3>필수기본항목</h3><div class="formrow">'+selectField('handling','문서취급',['전산망','이메일','기타'],data.handling)+selectField('visibility','공개여부',['공개','부분공개','비공개'],data.visibility)+'</div><div class="formrow">'+selectField('urgency','긴급여부',['일반문서','긴급처리문서'],data.urgency)+selectField('security','보안여부',['일반문서','보안문서'],data.security)+'</div><div class="formrow">'+selectField('documentType','문서구분',['내부결재','대내문서','대외문서','민원문서','경유문서'],data.documentType)+'<label>기록물철<input name="recordFolder" value="'+safe(data.recordFolder)+'"></label></div><div class="formrow"><label>발신인명<input name="sender" value="'+safe(data.sender)+'"></label><label>열람자<input name="viewers" value="'+safe(data.viewers)+'"></label>'+'</div>'+input('title','제목',existing?.title==='제목 없음'?'':existing?.title??'')+'<label>본문<textarea name="body" required>'+safe(existing?.body)+'</textarea></label></div></form>');
 $('draftEditor').onsubmit=e=>{

 };

function tripRequired(name,label,options,value=''){
 const control=options?'<select name="'+name+'" required><option value="">선택</option>'+options.map(x=>'<option'+(x===value?' selected':'')+'>'+x+'</option>').join('')+'</select>':'<input name="'+name+'" value="'+safe(value)+'" required>';
 return '<label class="trip-required">'+label+' <span class="trip-check" hidden aria-label="입력 완료">✓</span>'+control+'</label>';
}
function tripEditor(saved){
 const now=dateKey(new Date());
 const a=saved?.application??{},savedPlans=saved?.plans??[];
 const optional=(name,label,value)=>input(name,label,value??'').replace(' required','');
 showWide('<form id="tripEditor">'+dialogTop('출장신청서',false).replace('>상신<','>신청완료<')+'<div class="draftbody"><div class="formrow">'+selectField('kind','출장구분',['관내출장','관외출장','해외출장'],a.kind)+optional('person','대상자',a.person??'데모 사용자')+'</div><div class="formrow">'+input('start','출장기간 시작',a.start??now,'date')+input('end','출장기간 종료',a.end??now,'date')+'<label>출장일수<output id="tripDays">1일</output></label></div><div class="formrow">'+input('begin','시작시간',a.begin??'09:00','time')+input('finish','종료시간',a.finish??'18:00','time')+'</div><h3>일별 업무계획</h3><button type="button" id="planDays">일정등록</button><div id="tripPlans" class="tripplans"><p>등록된 일정이 없습니다.</p></div>'+tripRequired('visit','방문처',null,a.visit)+tripRequired('purpose','출장목적',null,a.purpose)+tripRequired('origin','출발지',null,a.origin)+tripRequired('destination','도착지',null,a.destination)+tripRequired('transport','교통수단',['자가용','대중교통','관용차량'],a.transport)+optional('via','경유지',a.via)+optional('distance','왕복출장거리',a.distance)+optional('driver','운전자',a.driver)+'</div></form>');
 const form=$('tripEditor'), fields=form.elements;
 const days=()=>{
  const first=Date.parse(fields.start.value),last=Date.parse(fields.end.value);
  return Number.isFinite(first)&&Number.isFinite(last)&&last>=first?1+(last-first)/86400000:0;
 };
 let signature='';
 const stamp=()=>['kind','start','end','begin','finish'].map(k=>fields[k].value).join('/');
 const updateTrip=()=>{
  $('tripDays').textContent=days()+'일';
  let ready=true;
  for(const label of form.querySelectorAll('.trip-required')){
   const filled=Boolean(label.querySelector('input,select').value.trim());
   label.querySelector('.trip-check').hidden=!filled;
   ready&&=filled;
  }
  form.querySelector('button[value="submit"]').disabled=!ready;
 };
 form.addEventListener('input',updateTrip);
 form.addEventListener('change',updateTrip);
 if(savedPlans.length){
  $('tripPlans').innerHTML=savedPlans.map(p=>'<div class="tripplan" data-trip-day="'+safe(p.date)+'"><span>'+safe(a.kind)+'　'+safe(p.date)+'　'+safe(a.begin)+'~'+safe(a.finish)+'</span>'+optional('plan','업무계획',p.body)+'<button type="button" data-remove-plan aria-label="'+safe(p.date)+' 일정 삭제">삭제</button></div>').join('');

 }
 updateTrip();
 $('planDays').onclick=()=>{
  const count=days();
  if(count<1||count>90||!fields.begin.value||!fields.finish.value||fields.begin.value>=fields.finish.value){notify('출장 기간은 1~90일로, 종료시간은 시작시간 이후로 지정해 주세요.');return}
  const previous=new Map([...$('tripPlans').querySelectorAll('[data-trip-day]')].map(r=>[r.dataset.tripDay,r.querySelector('input').value]));
  signature=stamp();
  $('tripPlans').innerHTML=Array.from({length:count},(_,i)=>{
   const date=new Date(Date.parse(fields.start.value)+i*86400000).toISOString().slice(0,10);
   return '<div class="tripplan" data-trip-day="'+date+'"><span>'+fields.kind.value+'　'+date+'　'+fields.begin.value+'~'+fields.finish.value+'</span>'+input('plan','업무계획',previous.get(date)??'').replace(' required','')+'<button type="button" data-remove-plan aria-label="'+date+' 일정 삭제">삭제</button></div>';
  }).join('');
 };
 $('tripPlans').onclick=e=>{const b=e.target.closest('[data-remove-plan]');if(b)b.closest('[data-trip-day]').remove()};
 form.onsubmit=e=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(form));
  if(signature!==stamp()||$('tripPlans').querySelectorAll('[data-trip-day]').length!==days())$('planDays').click();

function tripDraft(f,plans,savedLine=[]){
 const weekday=d=>['일','월','화','수','목','금','토'][new Date(d+'T12:00:00').getDay()];
 const dateLabel=d=>d+'('+weekday(d)+')';

 const cell=(label,value)=>'<th scope="row">'+label+'</th><td>'+safe(value)+'</td>';

 const table='<h3>결재라인</h3><table><tbody><tr><th scope="row">결재</th><td id="draftApprover"></td></tr><tr><th scope="row">합의</th><td id="draftAgreement"></td></tr></tbody></table><h3>출장정보</h3><table><tbody><tr>'+cell('출장기간',dateLabel(f.start)+' ~ '+dateLabel(f.end))+cell('일수',(plans.length-1)+'박'+plans.length+'일')+'</tr><tr>'+editable('출장자','person')+cell('인원','1명')+'</tr><tr>'+editable('출발지','origin')+editable('도착지','destination')+'</tr><tr>'+editable('경유지','via')+editable('왕복출장거리','distance')+'</tr><tr>'+editable('출장목적','purpose')+editable('운전자','driver')+'</tr><tr>'+editable('방문처','visit')+editable('출장구분','kind',['관내출장','관외출장','해외출장'])+'</tr><tr>'+editable('교통수단','transport',['자가용','대중교통','관용차량'])+'<td colspan="2"></td></tr></tbody></table>';
 const schedule='<h3>일별 업무계획</h3><table><thead><tr><th>일자</th><th>시작</th><th>종료</th><th>업무내용</th></tr></thead><tbody>'+plans.map(p=>'<tr><td>'+safe(dateLabel(p.date))+'</td><td>'+safe(f.begin)+'</td><td>'+safe(f.finish)+'</td><td>'+safe(p.body)+'</td></tr>').join('')+'</tbody></table>';
 const signature='<p class="submittext">상기와 같이 출장신청서를 제출합니다.</p><p class="submitdate">'+now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일</p>';
 showWide('<form id="finalTrip">'+dialogTop('출장 기안문',false)+'<div class="draftbody tripdoc"><h2>출장신청서</h2>'+input('title','제 목',title)+'<div class="docmenu">파일　　편집　　보기　　삽입　　서식　　표　　수식　　도움말</div><div class="docpaper" id="tripPaper">'+table+schedule+signature+'</div><pre id="tripSource" hidden></pre><div class="doctabs"><button type="button" data-mode="edit" aria-pressed="true">편집보기</button><button type="button" data-mode="html" aria-pressed="false">HTML보기</button><button type="button" data-mode="preview" aria-pressed="false">미리보기</button></div><div id="tripSignoff"><div class="roles"><span>직원</span><span>차장</span><span>부장</span><span>센터장</span></div><div class="formrow">'+'<div id="tripPeople"><button type="button" id="addTripPerson">인원 추가</button><div id="tripPersonRows"></div></div>'+'</div></div></div></form>');

 for(const person of savedLine??[]){

  if(!title||['visit','purpose','origin','destination','transport'].some(key=>!f[key])){
   notify('제목과 출장 필수 항목을 입력해 주세요.');return;
  }
  if(!party||line.some(p=>!p.rank||!p.name)){
   notify('결재 인원을 한 명 이상 추가하고 각 인원의 직급과 이름을 입력해 주세요.');return;
  }
  if(!confirm('출장 기안문을 최종 상신하시겠습니까?'))return;
  const body=[f.person+' · '+f.start+' ~ '+f.end+' · '+f.visit,f.purpose,...plans.map(p=>p.date+' '+p.body)].join('\n');
  const doc={title,body,party,date:dateKey(now),status:'결재중',template:'출장신청서',details:{trip:true,application:f,plans,approvalLine:line,agreement:line.filter(p=>p.role==="합의").map(describe).join(", ")}};
  const id=crypto.randomUUID?.()??String(Date.now());
  state.rows.unshift({...doc,id:'trip-'+id,type:'임직원업무관리',folder:'출장신청현황',approvalId:id});
  saveDoc({...doc,id,type:'전자결재',kind:'생산문서',folder:'상신문서'});
 };
}

function emailList(value){
 return [...new Set(String(value??'').split(/[;,\n]+/).map(x=>x.trim()).filter(Boolean))];
}
function validEmail(value){return /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(value)}
function cleanMailHtml(value){
 const doc=new DOMParser().parseFromString(String(value??''),'text/html');
 const allowed=new Set(['P','DIV','BR','B','STRONG','I','EM','U','UL','OL','LI','BLOCKQUOTE']);
 for(const el of [...doc.body.querySelectorAll('*')].reverse()){
  if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','IMG'].includes(el.tagName)){el.remove();continue}
  if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);continue}
  for(const attr of [...el.attributes])el.removeAttribute(attr.name);
 }
 return doc.body.innerHTML;
}
const mailFileDb=()=>new Promise((resolve,reject)=>{
 const request=indexedDB.open('intranet-mail-files',1);
 request.onupgradeneeded=()=>request.result.createObjectStore('attachments');
 request.onsuccess=()=>resolve(request.result);
 request.onerror=()=>reject(request.error);
});
async function mailFileOp(mode,callback){
 const db=await mailFileDb();
 try{return await new Promise((resolve,reject)=>{
  const tx=db.transaction('attachments',mode);
  let result;
  callback(tx.objectStore('attachments'),value=>result=value);
  tx.oncomplete=()=>resolve(result);
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error);
 })}finally{db.close()}
}

  }
  const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
  try{
   const pending=d.files.filter(file=>file.blob);
   if(window.serverFileSave){
    for(const file of pending){
     const saved=await window.serverFileSave(file);
     Object.assign(file,saved);delete file.blob;
    }
   }else if(pending.length)await mailFileOp('readwrite',store=>pending.forEach(file=>store.put(file.blob,file.id)));
   const metadata=d.files.map(({blob,...file})=>file);
   const record={id:d.id??(crypto.randomUUID?.()??String(Date.now())),type:'메일',folder:draft?'임시보관함':d.reserved?'예약메일함':'보낸메일함',
    title:d.title.trim()||'제목 없음',party:d.to,body:d.body,date:dateKey(new Date()),status:draft?'임시저장':d.reserved?'예약대기':'발송 기록',star:d.important,
    mail:{cc:d.cc,bcc:d.bcc,html:d.html,receipt:d.receipt,individual:d.individual,large:d.large,when:d.reserved?d.when:'',files:metadata}};
   const nextRows=[record,...state.rows.filter(r=>r.id!==record.id)];
   if(window.serverMailSave)await window.serverMailSave(nextRows);
   else{
    localStorage.setItem(key,JSON.stringify({...state,rows:nextRows}));
    state.rows=nextRows;
   }
   mailMode=false;mailEdit=null;
   changeFolder(record.folder);
   notify(draft?'임시보관함에 저장했습니다.':d.reserved?'예약메일함에 저장했습니다.':'보낸메일함에 발송 기록을 저장했습니다.');
  }catch(error){notify(error.message||'저장에 실패했습니다. 작성 내용을 유지했으니 다시 시도해 주세요.')}
  finally{buttons.forEach(b=>b.disabled=false)}
 };
};

function sheetSanitize(value,editable=false){

   const permitted=['colspan','rowspan','class'].includes(attr.name)||(editable&&['data-sheet','data-rich','type','value','contenteditable','aria-label'].includes(attr.name));

 }

}

iv><p class="official-error" role="alert"></p></aside></div></form>');

 const form=$('officialEditor');
 let attachments=structuredClone(details.attachments??[]);
 const apply=()=>{
  $('officialNavTitle').textContent=form.elements.title.value||'제목을 입력해주세요.';
  form.querySelectorAll('.reflected-title').forEach(el=>el.textContent=form.elements.title.value);
  form.querySelectorAll('.sheet-agreement').forEach(el=>el.textContent=lines.filter(p=>p.role!=='결재').map(p=>p.rank+' '+p.name).join(', '));
  form.querySelectorAll('.sheet-disclosure').forEach(el=>el.textContent=form.elements.visibility.value);
  form.querySelectorAll('.duty-approval').forEach(el=>el.textContent=lines.filter(p=>p.role==='결재').map(p=>p.rank+' '+p.name).join(' → '));
  $('officialLineSummary').textContent=lines.map(p=>p.role+' '+p.rank+' '+p.name).join(' → ')||'결재라인을 지정해 주세요.';
 };
 form.addEventListener('input',apply);form.addEventListener('change',apply);$('officialApply').onclick=apply;
 form.querySelectorAll('[data-sheet-format]').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>document.execCommand(b.dataset.sheetFormat,false)});
 const items=form.querySelector('.sheet-items tbody');
 if(items){
  const sum=()=>{$('sheetTotal').textContent=[...items.rows].reduce((n,row)=>n+Number(row.cells[5].querySelector('input').value||0),0).toLocaleString('ko-KR')};
  items.oninput=e=>{const row=e.target.closest('tr');const i=[...row.querySelectorAll('input')];if(i.indexOf(e.target)===3||i.indexOf(e.target)===4)i[5].value=Number(i[3].value||0)*Number(i[4].value||0);sum()};
  $('sheetAddRow').onclick=()=>items.insertAdjacentHTML('beforeend',sheetItem());
  $('sheetRemoveRow').onclick=()=>{if(items.rows.length>1)items.lastElementChild.remove();sum()};sum();
 }
 const drawFiles=()=>{
  $('officialFileList').innerHTML=attachments.map((f,i)=>'<p>'+safe(f.name)+' <button type="button" data-sheet-remove-file="'+i+'">제거</button></p>').join('');
 };
 $('officialFiles').onchange=()=>{
  for(const file of $('officialFiles').files){
   if(file.size>25*1024*1024){notify('파일은 25MB 이내로 첨부해 주세요.');continue}
   attachments.push({id:crypto.randomUUID(),name:file.name,size:file.size,type:file.type,blob:file});
  }
  $('officialFiles').value='';drawFiles();
 };
 $('officialFileList').onclick=e=>{const b=e.target.closest('[data-sheet-remove-file]');if(b){attachments.splice(Number(b.dataset.sheetRemoveFile),1);drawFiles()}};
 drawFiles();
 const snapshot=()=>{
  const copy=$('officialPaper').cloneNode(true);
  copy.querySelectorAll('input').forEach(input=>{input.replaceWith(document.createTextNode(input.value))});
  copy.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
  copy.querySelectorAll('.sheet-controls').forEach(el=>el.remove());
  return sheetSanitize(copy.innerHTML);
 };
 $('officialPreview').onclick=()=>{
  apply();
  const preview=document.createElement('dialog');preview.className='sheet-preview';
  preview.innerHTML='<button type="button">닫기</button>'+snapshot();
  preview.querySelector('button').onclick=()=>preview.close();
  preview.onclose=()=>preview.remove();document.body.append(preview);preview.showModal();
 };
 $('officialLine').onclick=()=>editOfficialLine(lines,next=>{lines=next;apply()});
 form.onsubmit=async e=>{
  e.preventDefault();apply();
  const draft=e.submitter?.value==='draft';
  if(!draft&&(!form.elements.title.value.trim()||!form.elements.recordFolder.value.trim()||!lines.some(p=>p.role==='결재'))){
   form.querySelector('.official-error').textContent='제목, 기록물철과 결재라인을 확인해 주세요.';return;
  }
  const values=Object.fromEntries(new FormData(form));
  const fields=Object.fromEntries([...form.querySelectorAll('[data-sheet]')].filter(el=>!el.dataset.sheet.startsWith('item')).map(el=>[el.dataset.sheet,el.value]));
  const rows=items?[...items.rows].map(row=>[...row.querySelectorAll('input')].map(input=>input.value)):[];
  const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
  try{
   for(const f of attachments.filter(f=>f.blob)){
    if(window.serverFileSave){Object.assign(f,await window.serverFileSave(f));delete f.blob}
    else{await mailFileOp('readwrite',store=>store.put(f.blob,f.id));delete f.blob}
   }
   const html=snapshot();
   const plain=new DOMParser().parseFromString(html,'text/html').body.textContent;
   const rec={id:existing?.folder==='임시보관문서'?existing.id:crypto.randomUUID(),type:'전자결재',kind:'생산문서',template,
    title:values.title.trim()||'제목 없음',body:plain,date:dateKey(new Date()),folder:draft?'임시보관문서':'상신문서',status:draft?'임시저장':'결재중',
    party:lines.filter(p=>p.role==='결재').map(p=>p.name).join(' → '),details:{...details,...values,...fields,rich:cleanMailHtml(form.querySelector('[data-rich]')?.innerHTML??''),sheetFields:fields,approvalLine:lines,sheetHTML:html,
     attachments:attachments.map(({blob,...metadata})=>metadata),purchase:items?{fields,rows}:undefined}};
   if(window.serverSave){
    state.rows=[rec,...state.rows.filter(r=>r.id!==rec.id)];await window.serverSave();$('modal').close();active='전자결재';changeFolder(rec.folder);
   }else{saveDoc(rec,existing)}
  }catch(error){form.querySelector('.official-error').textContent=error.message||'저장에 실패했습니다.'}
  finally{buttons.forEach(b=>b.disabled=false)}
 };
 apply();
};
function editOfficialLine(current,onApply){
 let selected=structuredClone(current);
 const dialog=document.createElement('dialog');dialog.className='line-dialog';
 dialog.innerHTML='<h2>결재라인지정</h2><div class="line-layout"><section><h3>인원 추가</h3><label>부서<input id="lineDepartment"></label><label>직급<input id="lineRank"></label><label>이름<input id="lineName"></label><label>결재유형<select id="lineRole"><option>결재</option><option>협조</option><option>합의</option></select></label><button type="button" id="lineAdd">추가 →</button><p id="lineError" role="alert"></p></section><section><h3>결재 순서</h3><div id="lineRows"></div><h3>내 결재라인</h3><input id="linePresetName" aria-label="결재라인 이름"><button id="lineSavePreset" type="button">저장</button><select id="linePresets" aria-label="저장한 결재라인"><option value="">선택</option></select><button id="lineLoadPreset" type="button">불러오기</button></section></div><button type="button" id="lineCancel">취소</button><button type="button" id="lineApply" class="primary">반영</button>';
 const q=id=>dialog.querySelector('#'+id);
 let presets={};try{presets=JSON.parse(localStorage.getItem('intranet-approval-presets')||'{}')}catch{}
 const options=()=>{q('linePresets').innerHTML='<option value="">선택</option>'+Object.keys(presets).map(name=>'<option>'+safe(name)+'</option>').join('')};
 const draw=()=>q('lineRows').innerHTML=selected.map((p,i)=>'<div class="line-row"><span>'+(i+1)+'　'+safe(p.department)+'　'+safe(p.rank)+' '+safe(p.name)+'　'+safe(p.role)+'</span><button type="button" data-move="-1" data-index="'+i+'" '+(!i?'disabled':'')+'>↑</button><button type="button" data-move="1" data-index="'+i+'" '+(i===selected.length-1?'disabled':'')+'>↓</button><button type="button" data-line-remove="'+i+'">삭제</button></div>').join('');
 q('lineAdd').onclick=()=>{
  const name=q('lineName').value.trim(),rank=q('lineRank').value.trim();
  if(!name||!rank){q('lineError').textContent='직급과 이름을 입력해 주세요.';return}
  const user=window.__serverBootstrap?.users.find(u=>u.name===name&&u.rank===rank);
  if(window.__serverBootstrap&&!user){q('lineError').textContent='사용자 관리에 등록된 직급과 이름을 입력해 주세요.';return}
  selected.push({department:q('lineDepartment').value.trim(),rank,name,role:q('lineRole').value,...(user?{userId:user.id}:{})});
  q('lineName').value='';q('lineError').textContent='';draw();
 };
 q('lineRows').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lineRemove!==undefined)selected.splice(Number(b.dataset.lineRemove),1);
  else{const i=Number(b.dataset.index),j=i+Number(b.dataset.move);[selected[i],selected[j]]=[selected[j],selected[i]]}draw();
 };
 q('lineSavePreset').onclick=()=>{
  const name=q('linePresetName').value.trim();if(!name)return;
  try{presets[name]=structuredClone(selected);localStorage.setItem('intranet-approval-presets',JSON.stringify(presets));options()}
  catch{q('lineError').textContent='결재라인을 저장할 수 없습니다.'}
 };
 q('lineLoadPreset').onclick=()=>{const found=presets[q('linePresets').value];if(Array.isArray(found)){selected=structuredClone(found);draw()}};
 q('lineApply').onclick=()=>{onApply(selected);dialog.close()};
 q('lineCancel').onclick=()=>dialog.close();dialog.onclose=()=>dialog.remove();
 options();draw();document.body.append(dialog);dialog.showModal();
}
viewRecord=function(record){
 if(!record.details?.sheetHTML){structuredViewPrevious(record);return}
 showWide('<div class="official-top"><strong>'+safe(record.title)+'</strong><button data-close>닫기</button></div><div class="sheet-saved">'+sheetSanitize(record.details.sheetHTML)+'</div><p>'+safe(record.status)+'</p>'+(record.folder==='임시보관문서'?'<button type="button" id="sheetContinue">이어서 작성</button>':'')+(record.folder==='결재대기문서'?'<button data-act="approve">승인</button><button data-act="reject">반려</button>':'')+'<div id="sheetAttachments"></div>');
 $('modal').dataset.record=record.id;
 if($('sheetContinue'))$('sheetContinue').onclick=()=>draftEditor(record.template,record);
 $('sheetAttachments').innerHTML=(record.details.attachments??[]).map((f,i)=>'<button data-attachment="'+i+'">'+safe(f.name)+' ↓</button>').join('');
 $('sheetAttachments').onclick=async e=>{
  const b=e.target.closest('[data-attachment]');if(!b)return;
  const file=record.details.attachments[Number(b.dataset.attachment)];
  if(window.__serverBootstrap){const a=document.createElement('a');a.href='/api/files/'+encodeURIComponent(file.id);a.click();return}
  try{
   const blob=await mailFileOp('readonly',(store,set)=>{const req=store.get(file.id);req.onsuccess=()=>set(req.result)});
   if(!blob)throw new Error();
   const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch{notify('첨부파일을 찾을 수 없습니다.')}
 };
};
$('modal').addEventListener('close',()=>{if(!$('modal').open)$('modal').classList.remove('official-modal')});

const sheetBuilders={'일반기안문':sheetGeneral,'일반기안문(위탁기관-비전자)':sheetTrust,'보고양식':sheetReport,
 '물품매입(수리제조)품의 및 요구서':sheetPurchase,'공사(수선)집행 품의요구서':sheetConstruction,
 '일직근무명령서':sheetDuty,'주간업무회의록':sheetMinutes};

}
function sheetDuty(existing){
 const fields=existing?.details?.sheetFields??{};
 const cell=(key,label,type='text')=>'<td>'+docInput(key,label,fields[key],type)+'</td>';
 const columns=['근무일자','근무자','근무시간','구분','근무내용','휴무합의일','비고'];
 return '<section class="official-sheet duty-sheet"><table><tbody><tr><td colspan="4"><h2>근무명령서</h2><p>(대체휴무, 일직수당, 근무시간 변경)</p></td><th>결재</th><td colspan="2" class="duty-approval"></td></tr><tr>'+columns.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+Array.from({length:4},(_,i)=>'<tr>'+cell('dutyDate'+i,'근무일자','date')+cell('dutyPerson'+i,'근무자')+'<td>'+docInput('dutyTime'+i,'근무시간',fields['dutyTime'+i])+'<p>주간누계시간</p>'+docInput('weeklyHours'+i,'주간누계시간',fields['weeklyHours'+i],'number')+'</td>'+cell('dutyKind'+i,'구분')+cell('dutyBody'+i,'근무내용')+cell('dutyOff'+i,'휴무합의일','date')+'<td><p>월간누계시간</p>'+docInput('monthlyHours'+i,'월간누계시간',fields['monthlyHours'+i],'number')+docInput('dutyNote'+i,'비고',fields['dutyNote'+i])+'</td></tr>').join('')+'<tr><td colspan="7"><p>'+docInput('department','부서',fields.department??'')+'의 근무계획을 제출함.</p><p class="sheet-date">'+dateKey(new Date())+'</p><p>작성자 '+docInput('author','작성자',fields.author??window.__serverBootstrap?.user.name??'')+'</p></td></tr></tbody></table></section>';
}
